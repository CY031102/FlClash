name: ATCSkylink Windows

on:
  push:
    branches:
      - main
      - 'atcskylink-*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      panel_url:
        description: 'Test build: panel address, e.g. http://172.232.162.202:7001 (leave empty for production)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Set only on a manual run that names a test panel.
  PANEL_URL: ${{ inputs.panel_url }}
  BUILD_SUFFIX: ${{ inputs.panel_url != '' && '-TEST' || '' }}
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-2022
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: atcskylink-windows
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Install dependencies
        run: flutter pub get

      # Logs need a sign-in; annotations and the job summary are public, so the
      # errors are copied there.
      - name: Analyze
        continue-on-error: true
        shell: pwsh
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | Tee-Object -FilePath analyze.txt
          $code = $LASTEXITCODE
          $errors = Get-Content analyze.txt | Where-Object { $_ -match '^\s*error\b' }
          $errors | Select-Object -First 20 | ForEach-Object { Write-Output "::error title=analyze::$($_.Trim())" }
          "### Analyze (exit $code)`n``````n$(($errors | Select-Object -First 80) -join "`n")`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code

      - name: Build installer and zip
        shell: pwsh
        run: |
          dart setup.dart windows --env stable 2>&1 | Tee-Object -FilePath build.txt
          $code = $LASTEXITCODE
          $errors = Get-Content build.txt | Where-Object { $_ -match '(?i)\berror\b|exception|failed' }
          $errors | Select-Object -First 20 | ForEach-Object { Write-Output "::error title=build::$($_.Trim())" }
          "### Build (exit $code)`n``````n$(((Get-Content build.txt) | Select-Object -Last 120) -join "`n")`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code

      - name: Mark test build
        if: env.BUILD_SUFFIX != ''
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -Include *.exe,*.zip |
            Rename-Item -NewName { $_.BaseName + $env:BUILD_SUFFIX + $_.Extension }
          "### Test build for $env:PANEL_URL" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ATCSkylink-windows${{ env.BUILD_SUFFIX }}
          path: |
            dist/**/*.exe
            dist/**/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.BUILD_SUFFIX == ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/*.zip
